# QMC calculator — served by Imperial Caddy reverse proxy
# Included from ~/stacks/caddy/Caddyfile

qmc.isd {
	import homelab_tls
	import homelab_headers

	encode gzip

	@api path /api/* /health
	handle @api {
		reverse_proxy host.docker.internal:4182 {
			header_up Host {host}
			header_up X-Forwarded-For {remote_host}
			header_up X-Forwarded-Proto {scheme}
		}
	}

	handle {
		reverse_proxy host.docker.internal:4182 {
			header_up Host {host}
			header_up X-Forwarded-For {remote_host}
			header_up X-Forwarded-Proto {scheme}
		}
	}
}
