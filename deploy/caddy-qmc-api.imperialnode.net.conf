# Public API for GitHub Pages calculator (Cloudflare DNS → Imperial WAN)
# Only /api/* and /health — never expose the Node static tree (would leak .env).

qmc-api.imperialnode.net {
	encode gzip

	@api path /api/* /health
	handle @api {
		# host.docker.internal requires UFW allow from 172.16.0.0/12 → 4182
		reverse_proxy host.docker.internal:4182 {
			header_up Host {host}
		}
	}

	handle {
		respond 404
	}
}
