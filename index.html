<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USAR Quartermaster Corps Price Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 40px;
      background: #0f172a;
      color: #f8fafc;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

.container {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 20px;
  align-items: start;
}

    .left-column {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.right-column {
  display: grid;
  grid-template-columns: repeat(3, minmax(250px, 1fr));
  gap: 20px;
  align-items: start;
}

    .card {
      background: #111827;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.35);
      border: 1px solid #1f2937;
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
    }

    .price {
      font-size: 42px;
      font-weight: bold;
      color: #60a5fa;
      text-align: center;
      margin-top: 20px;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #374151;
      font-size: 16px;
      background: #1f2937;
      color: white;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    textarea {
      width: 100%;
      height: 220px;
      resize: none;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #374151;
      font-size: 14px;
      margin-bottom: 12px;
      background: #1f2937;
      color: white;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #3b82f6;
      transform: translateY(-1px);
    }

    .hidden {
      display: none;
    }

    .price-note {
      font-size: 14px;
      color: #9ca3af;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>USAR Quartermaster Corps Uniform Price Calculator</h1>

<div class="container">

  <!-- LEFT SIDE -->
  <div class="left-column">

    <!-- FINAL PRICE -->
    <div class="card">
      <h2>Final Price</h2>

      <div class="price" id="finalPrice">$0</div>

      <div class="price-note">
        Base uniform: $150. Most ribbons, badges, and add-ons: $3 each.
        <br />
        <a href="https://docs.google.com/document/d/1fc9gU7zDWnZu_3xoFPyP9NUH3D0jb9kDJG7SaAFitOM/edit" target="_blank" rel="noopener noreferrer" style="color: #93c5fd;">QMC Uniform Guide</a>
      </div>
    </div>

    <!-- UNIFORM TYPE -->
    <div class="card">
      <h2>Uniform Type</h2>

      <select id="uniformSelect">
        <option value="">Select Uniform</option>
      </select>
    </div>

    <!-- ACCESSORIES -->
    <div class="card hidden" id="accessoriesCard">
      <h2>Accessories</h2>

      <div class="checkbox-group" id="accessoriesContainer"></div>
    </div>

    <!-- ORDER TEMPLATE -->
    <div class="card">
      <h2>Ordering Template</h2>

      <textarea id="templateOutput" readonly></textarea>

      <button id="copyButton">
        Copy Template
      </button>
    </div>

  </div>

  <!-- RIGHT SIDE -->
  <div class="right-column">

    <!-- RIBBONS -->
    <div class="card hidden" id="ribbonsCard">
      <h2>Ribbons</h2>

      <div class="checkbox-group" id="ribbonsContainer"></div>
    </div>

    <!-- BADGES -->
    <div class="card hidden" id="badgesCard">
      <h2>Badges</h2>

      <div class="checkbox-group" id="badgesContainer"></div>
    </div>

    <!-- FOREIGN DEVICES -->
    <div class="card hidden" id="foreignCard">
      <h2>Foreign Devices</h2>

      <div class="checkbox-group" id="foreignContainer"></div>
    </div>

  </div>

</div>

  <script>

    /*
    =====================================================
    EASY CUSTOMIZATION SECTION
    =====================================================

    HOW THIS WORKS:

    - Each uniform only lists assets allowed per the QMC Uniform Guide.
    - If a category is empty, it stays hidden.
    - Base uniform is $150; most add-ons are $3.

    TO ADD MORE ITEMS:

    Just add more text inside the arrays.

    Example:

    ribbons: [
      "Air Assault",
      "Combat Action",
      "New Ribbon"
    ]

    =====================================================
    */

    const DEFAULT_PRICE = 3;
    const BASE_UNIFORM_PRICE = 150;

    const item = (name, price = DEFAULT_PRICE) => ({ name, price });

    const RIBBONS = [
      item("Army Distinguished Service Cross"),
      item("Defense Distinguished Service"),
      item("Army Distinguished Service"),
      item("Silver Star"),
      item("Defense Superior Service"),
      item("Legion of Merit"),
      item("Distinguished Flying Cross"),
      item("Soldiers Medal"),
      item("Bronze Star"),
      item("Defense Meritorious Service"),
      item("Meritorious Service"),
      item("Air Medal"),
      item("Joint Service Commendation"),
      item("Army Commendation"),
      item("Joint Service Achievement"),
      item("Army Achievement"),
      item("Public Service Commendation Medal"),
      item("Wargames Medal"),
      item("Army Good Conduct"),
      item("Army of Occupation Medal"),
      item("Outstanding Volunteer"),
      item("National Defense Service", 0),
      item("Global War on Terrorism Service", 0),
      item("NCO Professional Development"),
      item("Army Service", 0),
      item("Military Justice"),
      item("Army Recruiting Ribbon"),
      item("United Nations Medal"),
      item("Antarctica Service"),
      item("Armed Forces Expeditionary Medal"),
      item("Southwest Asia Service"),
      item("Kosovo Campaign"),
      item("Kuwait Liberation Medal"),
      item("Afghanistan Campaign"),
      item("Iraq Campaign"),
      item("Joint Special Operations Campaign"),
      item("Global War on Terrorism Expeditionary"),
      item("Armed Forces Service Medal"),
      item("Army Sea Duty"),
      item("Army Overseas Service"),
      item("NATO Non-Article 5"),
      item("NATO Article 5"),
    ];

    const SKILL_BADGES = [
      item("Combat Infantryman Badge"),
      item("Combat Medical Badge"),
      item("Combat Action Badge"),
      item("Expert Infantryman Badge"),
      item("Expert Field Medical Badge"),
      item("Expert Soldier Badge"),
      item("Aviator Badge"),
      item("Flight Surgeon Badge"),
      item("Aviation Badge"),
      item("Army Astronaut Device"),
      item("Explosive Ordnance Disposal Badge"),
      item("Army Parachutist Badge"),
      item("Army Pathfinder Badge"),
      item("Army Air Assault Badge"),
      item("Military Freefall Badge"),
      item("Mountaineering Badge"),
      item("Space Operations Badge"),
      item("Special Operations Diver Badge"),
      item("Driver and Mechanic Badges"),
      item("Marksmanship Badges"),
    ];

    const SKILL_TABS = [
      item("Special Forces Tab"),
      item("Ranger Tab"),
      item("Sapper Tab"),
    ];

    const OCP_ID_BADGES = [
      item("Drill Sergeant Identification Badge"),
      item("Army Instructor Identification Badge"),
      item("Master Gunner Identification Badge"),
      item("Recruiter Badge"),
    ];

    const DRESS_ID_BADGES = [
      item("Army Staff Identification Badge"),
      item("Joint Chiefs of Staff Identification Badge"),
    ];

    const CSIB = item("Combat Service Identification Badge");
    const SERVICE_STRIPE = item("Service Stripe");
    const OVERSEAS_BAR = item("Overseas Bar");

    const FOREIGN_AWARDS_OCP = [
      item("Marine Special Operations Badge"),
      item("Marine Corps Combat Aircrew Badge"),
      item("Republic of Korea Jump Wings"),
      item("Royal Air Force Parachute Wings"),
      item("Royal Air Force Aviator Wings"),
      item("Armed Forces of the Philippines Airborne Badge"),
    ];

    const AGSU_ACCESSORIES = [
      item("Ribbon Offset"),
      item("RDI Offset"),
      item("Badge Offset"),
      item("Regimental Distinctive Insignia"),
      item("Shoulderloop Regimental Distinctive Insignia"),
      item("Unit Citation"),
      item("Officer Branch Insignia"),
      item("Infantry Cord / Infantry Buttons"),
    ];

    const CLASS_C_ACCESSORIES = [
      item("Ribbon Offset"),
      item("RDI Offset"),
      item("Badge Offset"),
      item("Regimental Distinctive Insignia"),
      item("Unit Citation"),
    ];

    const uniformData = {

      "AGSU (Class A)": {
        basePrice: BASE_UNIFORM_PRICE,
        ribbons: RIBBONS,
        badges: [
          ...SKILL_BADGES,
          ...SKILL_TABS,
          CSIB,
          ...DRESS_ID_BADGES,
          SERVICE_STRIPE,
          OVERSEAS_BAR,
        ],
        foreignDevices: [
          item("Republic of Korea Jump Wings"),
        ],
        accessories: AGSU_ACCESSORIES,
      },

      "OCP": {
        basePrice: BASE_UNIFORM_PRICE,
        ribbons: [],
        badges: [
          ...SKILL_BADGES,
          ...SKILL_TABS,
          CSIB,
          ...OCP_ID_BADGES,
        ],
        foreignDevices: FOREIGN_AWARDS_OCP,
        accessories: [],
      },

      "Rolled OCP": {
        basePrice: BASE_UNIFORM_PRICE,
        ribbons: [],
        badges: [
          ...SKILL_BADGES,
          ...SKILL_TABS,
          CSIB,
          ...OCP_ID_BADGES,
        ],
        foreignDevices: FOREIGN_AWARDS_OCP,
        accessories: [
          item("Watch"),
        ],
      },

      "Tigerstripes": {
        basePrice: BASE_UNIFORM_PRICE,
        ribbons: [],
        badges: [
          ...SKILL_BADGES,
          ...SKILL_TABS,
        ],
        foreignDevices: [],
        accessories: [],
      },

      "Class C": {
        basePrice: BASE_UNIFORM_PRICE,
        ribbons: RIBBONS,
        badges: [
          ...SKILL_BADGES,
          ...SKILL_TABS,
          CSIB,
          ...DRESS_ID_BADGES,
        ],
        foreignDevices: [],
        accessories: CLASS_C_ACCESSORIES,
      },

      "Class B": {
        basePrice: BASE_UNIFORM_PRICE,
        ribbons: RIBBONS,
        badges: [
          ...SKILL_TABS,
          ...SKILL_BADGES,
        ],
        foreignDevices: [],
        accessories: [
          item("Watch"),
          item("Regimental Distinctive Insignia"),
        ],
      },

    };

    const uniformSelect = document.getElementById("uniformSelect");
    const finalPrice = document.getElementById("finalPrice");
    const templateOutput = document.getElementById("templateOutput");
    const copyButton = document.getElementById("copyButton");

    const ribbonsCard = document.getElementById("ribbonsCard");
    const badgesCard = document.getElementById("badgesCard");
    const foreignCard = document.getElementById("foreignCard");
    const accessoriesCard = document.getElementById("accessoriesCard");

    const ribbonsContainer = document.getElementById("ribbonsContainer");
    const badgesContainer = document.getElementById("badgesContainer");
    const foreignContainer = document.getElementById("foreignContainer");
    const accessoriesContainer = document.getElementById("accessoriesContainer");


    // Populate uniform dropdown
    Object.keys(uniformData).forEach(uniform => {
      const option = document.createElement("option");
      option.value = uniform;
      option.textContent = uniform;
      uniformSelect.appendChild(option);
    });


    // Create checkbox list
    function createCheckboxes(container, items, type) {

  container.innerHTML = "";

  items.forEach(item => {

    // Supports BOTH strings and custom price objects
    const itemName = typeof item === "string"
      ? item
      : item.name;

    const itemPrice = typeof item === "string"
      ? DEFAULT_PRICE
      : item.price;

    const label = document.createElement("label");

    const checkbox = document.createElement("input");

    checkbox.type = "checkbox";
    checkbox.value = itemName;
    checkbox.dataset.type = type;
    checkbox.dataset.price = itemPrice;

    checkbox.addEventListener("change", updateCalculator);

    label.appendChild(checkbox);

    label.appendChild(
      document.createTextNode(`${itemName} (R$${itemPrice})`)
    );

    container.appendChild(label);

  });

}


    // Show/hide categories based on selected uniform
    uniformSelect.addEventListener("change", () => {

      const selectedUniform = uniformData[uniformSelect.value];

      // Reset all cards
      ribbonsCard.classList.add("hidden");
      badgesCard.classList.add("hidden");
      foreignCard.classList.add("hidden");
      accessoriesCard.classList.add("hidden");

      ribbonsContainer.innerHTML = "";
      badgesContainer.innerHTML = "";
      foreignContainer.innerHTML = "";
      accessoriesContainer.innerHTML = "";

      if (!selectedUniform) {
        updateCalculator();
        return;
      }

      // Ribbons
      if (selectedUniform.ribbons.length > 0) {
        ribbonsCard.classList.remove("hidden");
        createCheckboxes(
          ribbonsContainer,
          selectedUniform.ribbons,
          "Ribbons"
        );
      }

      // Badges
      if (selectedUniform.badges.length > 0) {
        badgesCard.classList.remove("hidden");
        createCheckboxes(
          badgesContainer,
          selectedUniform.badges,
          "Badges"
        );
      }

      // Foreign Devices
      if (selectedUniform.foreignDevices.length > 0) {
        foreignCard.classList.remove("hidden");
        createCheckboxes(
          foreignContainer,
          selectedUniform.foreignDevices,
          "Foreign Devices"
        );
      }

      // Accessories
      if (selectedUniform.accessories.length > 0) {
        accessoriesCard.classList.remove("hidden");
        createCheckboxes(
          accessoriesContainer,
          selectedUniform.accessories,
          "Accessories"
        );
      }

      updateCalculator();
    });


    // Main calculator
    function updateCalculator() {

      const checked = document.querySelectorAll("input[type='checkbox']:checked");

      const selectedUniform = uniformData[uniformSelect.value];

      let total = selectedUniform?.basePrice || 0;

      const selected = {
        "Badges": [],
        "Ribbons": [],
        "Foreign Devices": [],
        "Accessories": []
      };

      checked.forEach(box => {
        total += Number(box.dataset.price);

        selected[box.dataset.type].push(box.value);
      });

      finalPrice.textContent = `R$${total}`;

     templateOutput.value =
`Uniform Type: ${uniformSelect.value || "None"}

Final Price: $${total}

Badges:
${selected["Badges"].length
  ? selected["Badges"].map(item => `• ${item}`).join("\n")
  : "• None"}

Ribbons:
${selected["Ribbons"].length
  ? selected["Ribbons"].map(item => `• ${item}`).join("\n")
  : "• None"}

Foreign Devices:
${selected["Foreign Devices"].length
  ? selected["Foreign Devices"].map(item => `• ${item}`).join("\n")
  : "• None"}

Accessories:
${selected["Accessories"].length
  ? selected["Accessories"].map(item => `• ${item}`).join("\n")
  : "• None"}`;
    }


    updateCalculator();


    // Copy ordering template
    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(templateOutput.value);

        copyButton.textContent = "Copied!";

        setTimeout(() => {
          copyButton.textContent = "Copy Template";
        }, 1500);

      } catch (err) {
        alert("Failed to copy template.");
      }
    });

  </script>

</body>
</html>
